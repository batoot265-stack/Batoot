<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="knitBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#E5E0D8"/>
    </radialGradient>
    <linearGradient id="yellowChili" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#854D0E" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#knitBg)"/>
  
  <line x1="50" y1="0" x2="50" y2="800" stroke="#DDD5C7" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="150" y1="0" x2="150" y2="800" stroke="#DDD5C7" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="250" y1="0" x2="250" y2="800" stroke="#DDD5C7" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="350" y1="0" x2="350" y2="800" stroke="#DDD5C7" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="450" y1="0" x2="450" y2="800" stroke="#DDD5C7" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="550" y1="0" x2="550" y2="800" stroke="#DDD5C7" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="650" y1="0" x2="650" y2="800" stroke="#DDD5C7" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="750" y1="0" x2="750" y2="800" stroke="#DDD5C7" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Yellow Pepper Crochet Body -->
  <g filter="url(#shadow)" transform="rotate(-20 400 400)">
    <path d="M220,420 C280,360 480,360 580,410 C570,470 480,510 320,490 C250,480 200,450 220,420 Z" 
          fill="url(#yellowChili)" 
          stroke="#A16207" 
          stroke-width="8" 
          stroke-linejoin="round"/>
    
    <path d="M280,390 C360,400 440,410 520,425" stroke="#FEF9C3" stroke-width="4" stroke-dasharray="8,8" stroke-linecap="round" fill="none"/>
    <path d="M260,430 C340,440 420,450 510,460" stroke="#EAB308" stroke-width="4" stroke-dasharray="8,8" stroke-linecap="round" fill="none"/>
    <path d="M300,465 C370,475 440,480 480,485" stroke="#854D0E" stroke-width="4" stroke-dasharray="8,8" stroke-linecap="round" fill="none"/>

    <path d="M570,395 C590,390 620,380 640,400 C650,410 635,430 610,425 C595,430 580,435 570,425 Z" 
          fill="#3F6212" stroke="#1A2E05" stroke-width="5"/>
    <path d="M635,400 C660,390 680,405 675,420 C670,430 655,425 645,415" 
          fill="none" stroke="#365314" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
