<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="deskBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#deskBg)"/>

  <!-- Vintage Book with Spider symbol background -->
  <rect x="80" y="80" width="340" height="460" rx="16" fill="#78350F" stroke="#451A03" stroke-width="8" opacity="0.8"/>
  <path d="M250,260 C230,220 180,210 160,250 M250,260 C270,220 320,210 340,250" stroke="#CA8A04" stroke-width="6" fill="none"/>
  <circle cx="250" cy="270" r="18" fill="#CA8A04"/>

  <!-- Black Spider-Man Tapestry Rectangle -->
  <g filter="url(#shadow)" transform="rotate(-6 350 480)">
    <rect x="220" y="320" width="260" height="150" rx="12" fill="#111827" stroke="#374151" stroke-width="6"/>
    
    <!-- Left Spider Eye (Red border, white/pink center) -->
    <path d="M250,420 L275,355 L320,380 L310,425 Z" fill="#EF4444" stroke="#B91C1C" stroke-width="4"/>
    <path d="M260,410 L280,365 L310,385 L300,415 Z" fill="#FEE2E2"/>

    <!-- Right Spider Eye -->
    <path d="M440,420 L415,355 L370,380 L380,425 Z" fill="#EF4444" stroke="#B91C1C" stroke-width="4"/>
    <path d="M430,410 L410,365 L380,385 L390,415 Z" fill="#FEE2E2"/>
  </g>

  <!-- Pink Spider-Gwen Tapestry Rectangle -->
  <g filter="url(#shadow)" transform="rotate(4 450 560)">
    <rect x="300" y="470" width="280" height="160" rx="14" fill="#FBCFE8" stroke="#F472B6" stroke-width="6"/>
    
    <!-- Delicate Spider Web Pattern -->
    <path d="M440,550 L310,480 M440,550 L570,480 M440,550 L310,620 M440,550 L570,620" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="440" cy="550" r="30" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="440" cy="550" r="60" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Left Gwen Eye -->
    <path d="M340,570 L365,505 L410,530 L400,575 Z" fill="#E11D48" stroke="#9F1239" stroke-width="4"/>
    <path d="M350,560 L370,515 L400,535 L390,565 Z" fill="#FFF1F2"/>

    <!-- Right Gwen Eye -->
    <path d="M530,570 L505,505 L460,530 L470,575 Z" fill="#E11D48" stroke="#9F1239" stroke-width="4"/>
    <path d="M520,560 L500,515 L470,535 L480,565 Z" fill="#FFF1F2"/>
  </g>

  <!-- Crochet hooks in bottom corner -->
  <path d="M150,680 L350,580" stroke="#CA8A04" stroke-width="6" stroke-linecap="round"/>
  <path d="M170,710 L370,610" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
</svg>
