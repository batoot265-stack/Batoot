<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF5F7"/>
      <stop offset="100%" stop-color="#FCE7F3"/>
    </radialGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#831843" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- Wooden Peg Stand representation -->
  <rect x="375" y="450" width="50" height="240" rx="10" fill="#9A3412" opacity="0.8"/>
  <ellipse cx="400" cy="690" rx="90" ry="25" fill="#7C2D12" opacity="0.9"/>
  <ellipse cx="400" cy="450" rx="25" ry="10" fill="#7C2D12"/>

  <!-- Big Pink Bow -->
  <g filter="url(#shadow)">
    <!-- Left Loop -->
    <path d="M400,380 C360,300 240,260 200,320 C160,380 250,470 380,420 Z" 
          fill="url(#pinkGrad)" stroke="#9D174D" stroke-width="6"/>
    <!-- Left Ribbed Stitches -->
    <path d="M240,320 C270,360 320,390 380,410" fill="none" stroke="#FBCFE8" stroke-width="5" stroke-linecap="round"/>
    <path d="M220,350 C250,380 300,410 360,420" fill="none" stroke="#FBCFE8" stroke-width="5" stroke-linecap="round"/>

    <!-- Right Loop -->
    <path d="M400,380 C440,300 560,260 600,320 C640,380 550,470 420,420 Z" 
          fill="url(#pinkGrad)" stroke="#9D174D" stroke-width="6"/>
    <!-- Right Ribbed Stitches -->
    <path d="M560,320 C530,360 480,390 420,410" fill="none" stroke="#FBCFE8" stroke-width="5" stroke-linecap="round"/>
    <path d="M580,350 C550,380 500,410 440,420" fill="none" stroke="#FBCFE8" stroke-width="5" stroke-linecap="round"/>

    <!-- Left Ribbon Tail -->
    <path d="M380,410 C340,460 300,530 330,570 C350,550 370,540 390,440 Z" 
          fill="#BE185D" stroke="#9D174D" stroke-width="5"/>

    <!-- Right Ribbon Tail -->
    <path d="M420,410 C460,460 500,530 470,570 C450,550 430,540 410,440 Z" 
          fill="#BE185D" stroke="#9D174D" stroke-width="5"/>

    <!-- Center Knot -->
    <rect x="370" y="360" width="60" height="70" rx="20" fill="#BE185D" stroke="#831843" stroke-width="6"/>
    <path d="M385,375 L385,415" stroke="#FBCFE8" stroke-width="4" stroke-linecap="round"/>
    <path d="M415,375 L415,415" stroke="#FBCFE8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Little White Mini Bow in bottom corner -->
  <g transform="translate(560, 560) scale(0.3)" filter="url(#shadow)">
    <path d="M400,380 C360,300 240,260 200,320 C160,380 250,470 380,420 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="8"/>
    <path d="M400,380 C440,300 560,260 600,320 C640,380 550,470 420,420 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="8"/>
    <rect x="370" y="360" width="60" height="70" rx="20" fill="#F1F5F9" stroke="#94A3B8" stroke-width="8"/>
  </g>
</svg>
