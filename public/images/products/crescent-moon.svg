<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="100%" stop-color="#F5E6CA"/>
    </radialGradient>
    <radialGradient id="moonGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF066"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#CA8A04" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  
  <!-- Subtle fairy lights / sparkles -->
  <circle cx="200" cy="180" r="4" fill="#FACC15" opacity="0.6"/>
  <circle cx="620" cy="220" r="5" fill="#FDE047" opacity="0.7"/>
  <circle cx="680" cy="580" r="3" fill="#FACC15" opacity="0.5"/>
  <circle cx="160" cy="620" r="5" fill="#FDE047" opacity="0.6"/>
  <path d="M620,160 L623,175 L638,178 L623,181 L620,196 L617,181 L602,178 L617,175 Z" fill="#FACC15" opacity="0.8"/>
  <path d="M180,240 L182,250 L192,252 L182,254 L180,264 L178,254 L168,252 L178,250 Z" fill="#FACC15" opacity="0.7"/>

  <!-- Keychain Ring -->
  <circle cx="400" cy="160" r="32" fill="none" stroke="#D97706" stroke-width="10"/>
  <circle cx="400" cy="160" r="24" fill="none" stroke="#FDE68A" stroke-width="4"/>
  <rect x="395" y="190" width="10" height="40" rx="5" fill="#D97706"/>

  <!-- Crescent Moon Crochet Body -->
  <g filter="url(#shadow)">
    <!-- Main Crescent Path -->
    <path d="M480,240 C340,240 250,340 250,470 C250,600 350,690 490,680 C390,630 330,530 350,430 C370,330 430,270 480,240 Z" 
          fill="url(#moonGrad)" 
          stroke="#CA8A04" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Crochet Texture Stitches Accent -->
    <path d="M430,280 C330,340 300,450 310,540 C320,600 370,640 430,660" 
          fill="none" 
          stroke="#FEF08A" 
          stroke-width="6" 
          stroke-dasharray="12,12" 
          stroke-linecap="round"/>

    <!-- Cute Eyes -->
    <ellipse cx="345" cy="450" rx="8" ry="10" fill="#1F2937"/>
    <circle cx="343" cy="446" r="3" fill="#FFFFFF"/>
    
    <!-- Blush -->
    <ellipse cx="335" cy="465" rx="10" ry="6" fill="#F472B6" opacity="0.8"/>
    
    <!-- Smile -->
    <path d="M352,465 Q360,475 368,465" fill="none" stroke="#1F2937" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Hanging Little Mini Star -->
  <path d="M520,380 L525,400 L545,405 L525,410 L520,430 L515,410 L495,405 L515,400 Z" fill="#FDE047" stroke="#CA8A04" stroke-width="3" filter="url(#shadow)"/>
</svg>
