<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </radialGradient>
    <radialGradient id="whaleBlue" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1E3A8A" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- Bubbles -->
  <circle cx="220" cy="240" r="14" fill="#93C5FD" opacity="0.4"/>
  <circle cx="250" cy="200" r="8" fill="#93C5FD" opacity="0.5"/>
  <circle cx="580" cy="280" r="12" fill="#93C5FD" opacity="0.4"/>

  <!-- Whale Main Body -->
  <g filter="url(#shadow)">
    <!-- Blue Back -->
    <path d="M220,440 C220,300 360,250 500,280 C600,300 660,380 660,460 C600,480 500,480 400,480 C300,480 220,470 220,440 Z" fill="url(#whaleBlue)"/>
    
    <!-- Tail Fin -->
    <path d="M220,440 C170,420 140,380 120,390 C120,430 160,450 180,455 C150,470 120,500 130,520 C160,510 190,470 220,455 Z" fill="#1D4ED8"/>
    
    <!-- White Belly with stitch texture -->
    <path d="M240,460 C320,480 450,480 580,470 C550,560 420,580 320,550 C260,530 230,490 240,460 Z" fill="#FFFDF8" stroke="#E2E8F0" stroke-width="4"/>
    
    <!-- Side Fin -->
    <path d="M400,470 C420,490 440,530 460,525 C470,510 460,480 440,465 Z" fill="#2563EB" stroke="#1D4ED8" stroke-width="3"/>

    <!-- Cute Eyes -->
    <circle cx="540" cy="380" r="14" fill="#0F172A"/>
    <circle cx="544" cy="375" r="5" fill="#FFFFFF"/>
    
    <!-- Cheeks Blush -->
    <ellipse cx="560" cy="410" rx="12" ry="8" fill="#F43F5E" opacity="0.7"/>

    <!-- Little Water Spout Heart -->
    <path d="M480,240 C480,210 450,210 450,225 C450,210 420,210 420,225 C420,245 450,265 450,265 C450,265 480,245 480,225 Z" fill="#38BDF8"/>
  </g>
</svg>
